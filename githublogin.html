<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GitHub Giriş</title>
    <style>
        body {
            background-color: #335577;
            color: #ffffff;
            text-align: center;
            padding-top: 80px;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-left: 20px;
            padding-right: 20px;
        }
        h2 { font-size: 24px; margin-bottom: 10px; }
        p { color: #d0d7de; margin-bottom: 30px; font-size: 14px; }
        button {
            padding: 14px 28px;
            font-size: 16px;
            background-color: #24292e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 300px;
        }
        button:hover { background-color: #444c56; }
        button:disabled { background-color: #555; cursor: not-allowed; opacity: 0.7; }
        #status { margin-top: 20px; font-size: 14px; color: #ffeb3b; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GithubAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC_UbnaLpQv8Lnq65QQL9ARRZEPRZqW2d8",
          authDomain: "h-messenger-1779c.firebaseapp.com",
          databaseURL: "https://h-messenger-1779c-default-rtdb.firebaseio.com",
          projectId: "h-messenger-1779c",
          storageBucket: "h-messenger-1779c.firebasestorage.app",
          messagingSenderId: "769297013571",
          appId: "1:769297013571:web:53414fbbb30e15c97b2df6",
          measurementId: "G-4Y6ZN7W2SC"
        };

        const statusEl = document.getElementById("status");
        const loginBtn = document.getElementById("loginBtn");

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const provider = new GithubAuthProvider();

            statusEl.textContent = "Sistem hazır.";

            // GitHub'dan geri dönüldüğünde sonucu yakala
            getRedirectResult(auth)
              .then((result) => {
                if (result) {
                  const user = result.user;
                  const email = user.email || "Eposta_Bulunamadi";
                  statusEl.textContent = "Giriş başarılı! Uygulamaya aktarılıyor...";
                  
                  // App Inventor'a e-postayı gönder
                  setTimeout(() => {
                      if (window.AppInventor && window.AppInventor.setWebViewString) {
                          window.AppInventor.setWebViewString(email);
                      }
                  }, 500);
                }
              })
              .catch((error) => {
                statusEl.textContent = "Giriş Hatası: " + error.code;
                loginBtn.disabled = false;
              });

            // Butona tıklandığında yönlendirmeyi başlat
            window.girisYap = function() {
                loginBtn.disabled = true;
                statusEl.textContent = "GitHub'a yönlendiriliyorsunuz...";
                signInWithRedirect(auth, provider);
            }
        } catch (e) {
            statusEl.textContent = "Firebase Hatası: " + e.message;
        }
    </script>
</head>
<body>
    <h2>Uygulamaya Giriş Yap</h2>
    <p>Devam etmek için GitHub hesabınızı kullanın.</p>
    <button id="loginBtn" onclick="girisYap()">GitHub ile Giriş Yap</button>
    <div id="status"></div>
</body>
</html>
