<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ReCaptcha</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        /* Sayfa arkaplanı ve ortalama ayarları */
        body {
            background-color: #0035eF;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dalga ve kutu sarmalayıcısı */
        .captcha-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: 12px;
            animation: waveEffect 2.5s infinite ease-in-out;
        }

        /* reCAPTCHA kutusunu büyütmek için */
        .g-recaptcha {
            transform: scale(1.15);
            transform-origin: center;
            position: relative;
            z-index: 2; /* Kutunun dalganın önünde kalmasını sağlar */
        }

        /* Etrafta oluşan dalga animasyonu (#000010 renginde) */
        @keyframes waveEffect {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 0, 16, 0.4);
            }
            70% {
                box-shadow: 0 0 0 25px rgba(0, 0, 16, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 0, 16, 0);
            }
        }
    </style>
    <script>
        function captchaValidated(token) {
            // Doğrulama başarılı olduğunda App Inventor'a sinyal gönderir
            if (window.AppInventor) {
                window.AppInventor.setWebViewString("SUCCESS");
            }
        }
    </script>
</head>
<body>
    <div class="captcha-container">
        <form>
            <div class="g-recaptcha" data-sitekey="6Lf3kEstAAAAAGTh4_5ZEv7Z0ZS5mHYTnHotbPLl" data-callback="captchaValidated"></div>
        </form>
    </div>
</body>
</html>
