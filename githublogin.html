<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Giriş</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GithubAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC_UbnaLpQv8Lnq65QQL9ARRZEPRZqW2d8",
          authDomain: "h-messenger-1779c.firebaseapp.com",
          databaseURL: "https://h-messenger-1779c-default-rtdb.firebaseio.com",
          projectId: "h-messenger-1779c",
          storageBucket: "h-messenger-1779c.firebasestorage.app",
          messagingSenderId: "769297013571",
          appId: "1:769297013571:web:53414fbbb30e15c97b2df6",
          measurementId: "G-4Y6ZN7W2SC"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const provider = new GithubAuthProvider();

            // GitHub'dan dönüldüğünde sonucu yakala (Kullanıcının Firebase'e kaydedilmesi bu adımda gerçekleşir)
            getRedirectResult(auth)
              .then((result) => {
                if (result) {
                  const user = result.user;
                  // Başarılı giriş sonrası App Inventor'a özel URL ile verileri aktar
                  window.location.href = "appinventor://login_success?email=" + encodeURIComponent(user.email || "") + "&name=" + encodeURIComponent(user.displayName || "");
                }
              })
              .catch((error) => {
                alert("Giriş Tamamlama Hatası: " + error.code + " - " + error.message);
              });

            // Butona tıklandığında GitHub yönlendirmesini başlat
            window.girisYap = function() {
              signInWithRedirect(auth, provider).catch((error) => {
                alert("Giriş Başlatılamadı: " + error.code + " - " + error.message);
              });
            }
        } catch (e) {
            alert("Firebase Başlatma Hatası: " + e.message);
        }
    </script>
</head>
<body style="text-align: center; margin-top: 80px; font-family: Arial, sans-serif; background-color: #f6f8fa;">
    <h2>Uygulamaya Giriş Yap</h2>
    <p style="color: #586069; margin-bottom: 30px;">Devam etmek için GitHub hesabınızı kullanın.</p>
    <button onclick="girisYap()" style="padding: 14px 28px; font-size: 16px; background-color: #24292e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
      GitHub ile Giriş Yap
    </button>
</body>
</html>
