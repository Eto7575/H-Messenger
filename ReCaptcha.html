<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://www.google.com/recaptcha/api.js?render=6LeeMtYtAAAAAOpZjbrMuhPxjuMmFzfn_vKEqyUh"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0055cc;
            overflow: hidden;
        }
        
        .grecaptcha-badge {
            position: static !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15) !important;
            transform: scale(1.0) !important;
            transform-origin: center center !important;
        }
    </style>
</head>
<body>
    <script>
        grecaptcha.ready(function() {
            grecaptcha.execute('6LeeMtYtAAAAAOpZjbrMuhPxjuMmFzfn_vKEqyUh', {action: 'USER_ACTION'}).then(function(token) {
                if (window.AppInventor) {
                    // 1. Eski blokların kilitlenmemesi için "SUCCESS" gönder
                    window.AppInventor.setWebViewString("SUCCESS");
                    
                    // 2. Hemen ardından yeni REST API bloklarında kullanmak üzere token'ı gönder
                    setTimeout(function() {
                        window.AppInventor.setWebViewString(token);
                    }, 50);
                }
            });
        });
    </script>
</body>
</html>
